name: Build Redmi Note 11 (spes) Sitanshu Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source (With Submodules)
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        submodules: 'recursive'

    - name: Set up Build Environment
      run: |
        sudo apt-get update || true
        sudo apt-get install -y --no-install-recommends \
          build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev git python3 python-is-python3 gcc g++ wget tar ccache lld clang gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi device-tree-compiler zip unzip

    - name: Restore Proton Clang Cache
      id: restore-clang
      uses: actions/cache/restore@v4
      with:
        path: ~/clang
        key: proton-clang-spes-v1

    - name: Setup Proton Clang Toolchain
      run: |
        if [ ! -f "$HOME/clang/bin/clang" ]; then
          echo "Clang missing from cache. Downloading..."
          rm -rf ~/clang
          mkdir -p ~/clang
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git ~/clang
        else
          echo "Proton Clang loaded directly from Cache!"
        fi

    - name: Force Save Proton Clang Cache
      uses: actions/cache/save@v4
      if: always() && steps.restore-clang.outputs.cache-hit != 'true'
      with:
        path: ~/clang
        key: proton-clang-spes-v1

    - name: Restore ccache Compilation Objects
      uses: actions/cache/restore@v4
      with:
        path: ~/.ccache
        key: ccache-spes-static

    - name: Fix Kconfig & Inject Serial Lock (cd7276a2)
      run: |
        mkdir -p drivers/net/wireless/realtek/rt38821cs
        touch drivers/net/wireless/realtek/rt38821cs/Kconfig

        python3 -c '
        with open("init/main.c", "r") as f:
            content = f.read()

        if "cd7276a2" not in content:
            import re
            pattern = r"(static\s+noinline\s+void\s+__init\s+kernel_init_freeable\s*\(\s*void\s*\)\s*\{)"
            replacement = r"\1\n\tif (!strstr(saved_cmdline, \"cd7276a2\")) {\n\t\tpanic(\"Unauthorized Hardware! Serial mismatch.\");\n\t}"
            if re.search(pattern, content):
                content = re.sub(pattern, replacement, content, count=1)
            else:
                content = content.replace("kernel_init_freeable(void)\n{", "kernel_init_freeable(void)\n{\n\tif (!strstr(saved_cmdline, \"cd7276a2\")) {\n\t\tpanic(\"Unauthorized Hardware! Serial mismatch.\");\n\t}")

        with open("init/main.c", "w") as f:
            f.write(content)
        '

    - name: Build Kernel Image
      run: |
        export PATH="$HOME/clang/bin:$PATH"
        export USE_CCACHE=1
        export CCACHE_DIR="$HOME/.ccache"
        ccache -M 10G

        mkdir -p out
        DEFCONFIG="stock_defconfig"

        make -j$(nproc --all) O=out ARCH=arm64 "$DEFCONFIG"

        scripts/config --file out/.config --set-str CONFIG_LOCALVERSION "-Sitanshu"
        scripts/config --file out/.config --disable IKHEADERS || true

        make -j$(nproc --all) O=out \
          ARCH=arm64 \
          CC="ccache clang" \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          KCFLAGS="-w -Wno-error" \
          KCPPFLAGS="-w" \
          Image.gz

    - name: Force Save ccache Compilation Objects
      uses: actions/cache/save@v4
      if: always()
      with:
        path: ~/.ccache
        key: ccache-spes-static

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RedmiNote11-Sitanshu-Locked-Kernel
        path: out/arch/arm64/boot/Image.gz
        
