name: Build Redmi Note 11 (spes) Sitanshu Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        submodules: 'recursive'

    - name: Set up Build Environment
      run: |
        sudo apt-get update || true
        sudo apt-get install -y --no-install-recommends \
          build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev git python3 gcc g++ wget tar ccache lld clang gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi device-tree-compiler zip unzip

    - name: Cache Proton Clang Toolchain
      uses: actions/cache@v4
      with:
        path: ~/clang
        key: proton-clang-spes-v11

    - name: Setup Proton Clang Toolchain
      run: |
        if [ ! -f "$HOME/clang/bin/clang" ]; then
          rm -rf ~/clang
          mkdir -p ~/clang
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git ~/clang
        fi

    - name: Fix Kconfig and Inject Standalone Serial Lock
      run: |
        # Missing Driver Kconfig Fix
        mkdir -p drivers/net/wireless/realtek/rt38821cs
        touch drivers/net/wireless/realtek/rt38821cs/Kconfig

        # Create Isolated C File for Serial Check
        echo '#include <linux/init.h>' > init/sitanshu_lock.c
        echo '#include <linux/kernel.h>' >> init/sitanshu_lock.c
        echo '#include <linux/string.h>' >> init/sitanshu_lock.c
        echo 'extern char boot_command_line[];' >> init/sitanshu_lock.c
        echo 'static int __init sitanshu_check_serial(void) {' >> init/sitanshu_lock.c
        echo '    if (!strstr(boot_command_line, "cd7276a2")) {' >> init/sitanshu_lock.c
        echo '        panic("Unauthorized Hardware! Serial mismatch.");' >> init/sitanshu_lock.c
        echo '    }' >> init/sitanshu_lock.c
        echo '    return 0;' >> init/sitanshu_lock.c
        echo '}' >> init/sitanshu_lock.c
        echo 'early_initcall(sitanshu_check_serial);' >> init/sitanshu_lock.c

        # Link sitanshu_lock.o in Makefile
        if ! grep -q "sitanshu_lock.o" init/Makefile; then
          echo "obj-y += sitanshu_lock.o" >> init/Makefile
        fi

    - name: Build Kernel Image
      run: |
        export PATH="$HOME/clang/bin:$PATH"
        export USE_CCACHE=1
        export CCACHE_DIR="$HOME/.ccache"
        ccache -M 10G

        mkdir -p out
        make -j$(nproc --all) O=out ARCH=arm64 stock_defconfig

        scripts/config --file out/.config --set-str CONFIG_LOCALVERSION "-Sitanshu"
        scripts/config --file out/.config --disable IKHEADERS || true

        make -j$(nproc --all) O=out \
          ARCH=arm64 \
          CC="ccache clang" \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          LLVM_IAS=0 \
          KCFLAGS="-w -Wno-error" \
          KCPPFLAGS="-w" \
          Image.gz

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RedmiNote11-Sitanshu-Locked-Kernel
        path: out/arch/arm64/boot/Image.gz
        
