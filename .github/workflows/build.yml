name: Build Redmi Note 11 (spes) Sitanshu Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source (With Submodules)
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        submodules: 'recursive'

    - name: Set up Build Environment
      run: |
        sudo apt-get update || true
        sudo apt-get install -y --no-install-recommends \
          build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev git python3 python-is-python3 gcc g++ wget tar ccache lld clang gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi device-tree-compiler zip unzip

    - name: Cache Proton Clang Toolchain
      uses: actions/cache@v4
      with:
        path: ~/clang
        key: proton-clang-spes-v2

    - name: Setup Proton Clang Toolchain
      run: |
        if [ ! -f "$HOME/clang/bin/clang" ]; then
          echo "Downloading Proton Clang..."
          rm -rf ~/clang
          mkdir -p ~/clang
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git ~/clang
        else
          echo "Proton Clang loaded directly from Cache!"
        fi

    - name: Fix Kconfig & Apply Serial Lock (cd7276a2)
      run: |
        # Missing Kconfig File Auto-Fix
        mkdir -p drivers/net/wireless/realtek/rt38821cs
        touch drivers/net/wireless/realtek/rt38821cs/Kconfig

        # Direct, reliable C injection via sed
        sed -i '/setup_arch(&command_line);/a \    if (!strstr(boot_command_line, "cd7276a2")) { panic("Unauthorized Hardware! Serial mismatch."); }' init/main.c

    - name: Build Kernel Image
      run: |
        export PATH="$HOME/clang/bin:$PATH"
        export USE_CCACHE=1
        export CCACHE_DIR="$HOME/.ccache"
        ccache -M 10G

        mkdir -p out
        DEFCONFIG="stock_defconfig"

        make -j$(nproc --all) O=out ARCH=arm64 "$DEFCONFIG"

        scripts/config --file out/.config --set-str CONFIG_LOCALVERSION "-Sitanshu"
        scripts/config --file out/.config --disable IKHEADERS || true

        make -j$(nproc --all) O=out \
          ARCH=arm64 \
          CC="ccache clang" \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          KCFLAGS="-w -Wno-error" \
          KCPPFLAGS="-w" \
          Image.gz

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RedmiNote11-Sitanshu-Locked-Kernel
        path: out/arch/arm64/boot/Image.gz
        
