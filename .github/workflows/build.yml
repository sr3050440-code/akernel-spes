name: Build Redmi Note 11 (spes) Sitanshu Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source (With Submodules)
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        submodules: 'recursive'

    - name: Set up Build Environment
      run: |
        sudo apt-get update || true
        sudo apt-get install -y --no-install-recommends \
          build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev git python2 python3 gcc g++ wget tar ccache lld clang gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Cache Proton Clang Toolchain (Instant Restore)
      id: cache-clang
      uses: actions/cache@v4
      with:
        path: ~/clang
        key: proton-clang-v1

    - name: Cache Kernel Compilation Objects (ccache)
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ runner.os }}-

    - name: Setup Clang Toolchain (Proton Clang)
      run: |
        if [ ! -d "$HOME/clang/bin" ]; then
          echo "Clang not cached. Downloading Proton Clang..."
          mkdir -p ~/clang
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git ~/clang
        else
          echo "Clang restored successfully from Cache!"
        fi

    - name: Fix Missing Kconfig & Apply Serial Lock (cd7276a2)
      run: |
        # Missing Kconfig File Auto-Fix
        mkdir -p drivers/net/wireless/realtek/rt38821cs
        touch drivers/net/wireless/realtek/rt38821cs/Kconfig
        
        # Inject Serial Lock safely into init/main.c via Python
        python3 -c '
        with open("init/main.c", "r") as f:
            content = f.read()

        check = "\n\tif (!strstr(boot_command_line, \"cd7276a2\")) {\n\t\tpanic(\"Unauthorized Hardware! Serial mismatch.\");\n\t}\n"

        if "pr_notice(\"Kernel command line: %s\\n\", boot_command_line);" in content:
            content = content.replace("pr_notice(\"Kernel command line: %s\\n\", boot_command_line);", "pr_notice(\"Kernel command line: %s\\n\", boot_command_line);" + check)
        elif "setup_arch(&command_line);" in content:
            content = content.replace("setup_arch(&command_line);", "setup_arch(&command_line);" + check)

        with open("init/main.c", "w") as f:
            f.write(content)
        '

    - name: Build Kernel
      run: |
        export PATH="$HOME/clang/bin:$PATH"
        export USE_CCACHE=1
        export CCACHE_DIR="$HOME/.ccache"
        ccache -M 5G
        
        mkdir -p out
        DEFCONFIG="stock_defconfig"
        
        echo "Using Defconfig: $DEFCONFIG"
        make -j$(nproc --all) O=out ARCH=arm64 "$DEFCONFIG"
        
        # Custom Kernel Name (Sitanshu)
        scripts/config --file out/.config --set-str CONFIG_LOCALVERSION "-Sitanshu"
        scripts/config --file out/.config --disable IKHEADERS || true
        
        make -j$(nproc --all) O=out ARCH=arm64 CC="ccache clang" LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RedmiNote11-Sitanshu-Locked-Kernel
        path: out/arch/arm64/boot/
        
