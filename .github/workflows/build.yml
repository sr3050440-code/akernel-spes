name: Build Redmi Note 11 (spes) Sitanshu Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: 'recursive'

      - name: Cache Proton Clang & Ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/clang
            ~/.ccache
          key: spes-stable-v16-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            spes-stable-v16-${{ runner.os }}-

      - name: Setup Build Dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends \
            build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev git python3 gcc g++ wget tar ccache lld clang gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi device-tree-compiler zip unzip

          if [ ! -f "$HOME/clang/bin/clang" ]; then
            rm -rf ~/clang
            mkdir -p ~/clang
            git clone --depth=1 https://github.com/kdrag0n/proton-clang.git ~/clang
          fi

      - name: Fix Kconfig & Inject Serial Lock
        run: |
          # Missing Realtek Wireless Kconfig Fix
          mkdir -p drivers/net/wireless/realtek/rt38821cs
          touch drivers/net/wireless/realtek/rt38821cs/Kconfig

          # Clean Base64 injection of Serial Lock into init/main.c
          if ! grep -q "cd7276a2" init/main.c; then
            echo "" | base64 -d >> init/main.c
          fi

      - name: Build Kernel Image
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          export USE_CCACHE=1
          export CCACHE_DIR="$HOME/.ccache"
          ccache -M 10G

          mkdir -p out
          make -j$(nproc --all) O=out ARCH=arm64 stock_defconfig

          # Set Sitanshu Juneja Branding
          scripts/config --file out/.config --set-str CONFIG_LOCALVERSION "-Sitanshu-Juneja"
          scripts/config --file out/.config --disable CONFIG_IKHEADERS || true

          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM_IAS=0 \
            KCFLAGS="-w -Wno-error" \
            KCPPFLAGS="-w" \
            Image.gz

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedmiNote11-SitanshuJuneja-Locked-Kernel
          path: out/arch/arm64/boot/Image.gz
